<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WhatsApp AI Assistant - Help</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.6;
      color: #333;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e9ecef;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #333;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    h2 {
      color: #25d366;
      margin-top: 30px;
      margin-bottom: 15px;
      font-size: 20px;
    }

    h3 {
      color: #333;
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .step {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin: 15px 0;
      border-left: 4px solid #25d366;
    }

    .step-number {
      background: #25d366;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-right: 10px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .feature-card {
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .feature-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .code-block {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      padding: 15px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 14px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 4px;
      padding: 15px;
      margin: 15px 0;
    }

    .warning-icon {
      color: #856404;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <script>
    document.title = chrome.i18n.getMessage('helpPageTitle');

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const message = chrome.i18n.getMessage(el.getAttribute('data-i18n'));
      if (message) el.textContent = message;
    });

    // These keys contain trusted, static markup (links/strong/code) defined in our own
    // _locales messages.json, so innerHTML here is not attacker-controlled.
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const message = chrome.i18n.getMessage(el.getAttribute('data-i18n-html'));
      if (message) el.innerHTML = message;
    });
  </script>
